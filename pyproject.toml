[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insighta-sdk"
version = "0.1.5"
description = "Insighta Cloud SDK - API client and data models"
readme = "README.md"
license = "CC-BY-NC-4.0"
requires-python = ">=3.10"
authors = [{ name = "insighta cloud Inc.", email = "tech@insighta.cloud" }]
dependencies = [
    "requests",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://insighta.cloud"

[tool.hatch.build.targets.wheel]
packages = ["insighta_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires real API connection (INSIGHTA_DEV_API_KEY)"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
